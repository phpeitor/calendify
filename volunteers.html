<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="./js/auth-guard.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='75'>📅</text></svg>" />
    <title>Calendify | Voluntarios</title>
    <link rel="stylesheet" href="./css/backend-plugin.min.css">
    <link rel="stylesheet" href="./css/backend.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/line-awesome.min.css">
    <link rel="stylesheet" href="./css/remixicon.css">
    <link rel='stylesheet' href='./css/main.css' />
    <link rel='stylesheet' href='./css/daygrid_main.css' />
    <link rel='stylesheet' href='./css/timegrid_main.css' />
    <link rel='stylesheet' href='./css/list_main.css' />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css">
  </head>
  <body class="fixed-top-navbar top-nav">
    <div id="loading">
      <div id="loading-center"></div>
    </div>

    <div class="wrapper">
      <div id="header-container"></div>

      <div class="content-page">
        <div class="container">
          <div class="row">
            <div class="col-lg-12 mt-4">
              <div class="d-flex flex-wrap align-items-center justify-content-between my-schedule mb-3">
                <div class="d-flex align-items-center justify-content-between">
                  <h3>Voluntarios</h3>
                </div>
              </div>

              <div class="card card-block card-stretch mb-3">
                <div class="card-body">
                  <form id="volunteers-filter" class="row align-items-end">
                    <div class="col-md-6 col-lg-4 mb-3 mb-md-0">
                      <label for="volunteers-date-range">Buscar por fecha</label>
                      <div class="input-group">
                        <div class="input-group-prepend">
                          <span class="input-group-text"><i class="ri-calendar-line" aria-hidden="true"></i></span>
                        </div>
                        <input type="text" id="volunteers-date-range" class="form-control" aria-label="Rango de fechas de voluntarios" required>
                      </div>
                    </div>
                    <div class="col-md-2 mt-3 mt-md-0">
                      <button type="submit" class="btn btn-primary btn-block">
                        <i class="las la-search pr-2" aria-hidden="true"></i>Buscar
                      </button>
                    </div>
                  </form>
                </div>
              </div>

              <div class="card card-block card-stretch card-height">
                <div class="card-body">
                  <div class="table-responsive data-table">
                    <table class="table" id="volunteers-datatable" style="width: 100%;">
                      <thead>
                        <tr id="volunteers-table-head"></tr>
                      </thead>
                      <tbody id="volunteers-table-body">
                        <tr>
                          <td class="text-center py-4">Seleccione un rango para cargar voluntarios.</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

<div id="footer-container"></div>
<div id="dialogs-container"></div>

<script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
<script src="./js/backend-bundle.min.js"></script>
<script src="./js/customizer.js"></script>
<script src='./js/main.js'></script>
<script src='./js/daygrid_main.js'></script>
<script src='./js/timegrid_main.js'></script>
<script src='./js/list_main.js'></script>
<script src='./js/interaction_main.js'></script>
<script src="./js/layout.js"></script>
<script src="./js/app.js"></script>
<script src="./js/volunteers-page.js"></script>
</body>
</html>
